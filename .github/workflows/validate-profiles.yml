name: Validate wallet profile service
on:
  push:
    paths: ['profile-service/**', 'netlify/functions/**', 'site/roar-*.mjs', 'tests/roar-data.test.mjs', '.github/workflows/validate-profiles.yml']
  pull_request:
    paths: ['profile-service/**', 'netlify/functions/**', 'site/roar-*.mjs', 'tests/roar-data.test.mjs', '.github/workflows/validate-profiles.yml']
permissions:
  contents: read
jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: node --test profile-service/*.test.mjs tests/roar-data.test.mjs
      - run: node --check profile-service/server.mjs
      - run: node --check profile-service/wallet-client.mjs
      - run: node --check profile-service/profile-page.mjs
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          REOWN_PROJECT_ID: '00000000000000000000000000000000'
          PROFILE_ORIGIN: 'https://example.invalid'
      - run: python3 scripts/check_site.py
