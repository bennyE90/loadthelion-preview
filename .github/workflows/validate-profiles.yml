name: Validate wallet profile service
on:
  push:
    paths: ['profile-service/**', '.github/workflows/validate-profiles.yml']
  pull_request:
    paths: ['profile-service/**', '.github/workflows/validate-profiles.yml']
permissions:
  contents: read
jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix profile-service
      - run: node --test profile-service/auth.test.mjs profile-service/wallet-discovery.test.mjs
      - run: node --check profile-service/server.mjs
      - run: node --check profile-service/wallet-client.mjs
      - run: node --check profile-service/profile-page.mjs
      - run: npm audit --prefix profile-service --omit=dev --audit-level=high
